name: Appli iOS Bookloo

# Construit l'appli iPhone (dossier app-ios/) à chaque push qui la touche :
# IPA non signée (à installer avec FlareStore / SideStore / Sideloadly) + Release + source AltStore.
on:
  push:
    branches: [main]
    paths: ['app-ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app-ios } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app-ios/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit

  ios:
    needs: check
    runs-on: macos-latest
    defaults: { run: { working-directory: app-ios } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app-ios/package-lock.json }
      - run: npm ci
      - name: Numéro de version (1.0.<n° de build>)
        run: |
          node -e "const f='app.json';const a=require('./'+f);a.expo.version='1.0.${{ github.run_number }}';a.expo.ios.buildNumber='${{ github.run_number }}';require('fs').writeFileSync(f,JSON.stringify(a,null,2))"
      - name: Génère le projet iOS
        run: npx expo prebuild --platform ios --no-install --clean
      - name: Installe les pods
        working-directory: app-ios/ios
        run: pod install
      - name: Compile l'app (non signée)
        run: |
          xcodebuild \
            -workspace ios/Bookloo.xcworkspace \
            -scheme Bookloo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > xcodebuild.log 2>&1 || {
              grep -E "error:|\*\* BUILD FAILED" xcodebuild.log | sort -u | head -30 | while IFS= read -r l; do echo "::error::$l"; done
              tail -n 80 xcodebuild.log
              exit 1
            }
          tail -n 20 xcodebuild.log
          test -f build/Build/Products/Release-iphoneos/Bookloo.app/Info.plist
      - name: Emballe l'IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Bookloo.app Payload/
          zip -qry bookloo-unsigned.ipa Payload
          size=$(stat -f %z bookloo-unsigned.ipa)
          echo "IPA : $size octets"
          if [ "$size" -lt 3000000 ]; then echo "::error::IPA anormalement petite ($size octets)"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with: { name: bookloo-ios, path: app-ios/bookloo-unsigned.ipa }

  release:
    needs: ios
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: bookloo-ios, path: app-ios }
      - name: Notes et source AltStore
        working-directory: app-ios
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          printf '%s\n' "$COMMIT_MSG" | grep -viE '^(Co-Authored-By|Claude-Session)' | sed '/^$/d' | head -8 > notes.md
          { echo 'RELEASE_NOTES<<BL_EOF'; cat notes.md; echo; echo 'BL_EOF'; } >> "$GITHUB_ENV"
          node scripts/make-source.mjs "1.0.${{ github.run_number }}" "ios-${{ github.run_number }}" bookloo-unsigned.ipa
          {
            echo "## Bookloo iPhone 1.0.${{ github.run_number }}"
            echo
            cat notes.md
            echo
            echo "---"
            echo "FlareStore / SideStore : ajoute la source https://github.com/${{ github.repository }}/releases/latest/download/altstore.json"
            echo "Ou installe bookloo-unsigned.ipa avec Sideloadly."
          } > body.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-${{ github.run_number }}
          name: Bookloo iPhone 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body_path: app-ios/body.md
          files: |
            app-ios/bookloo-unsigned.ipa
            app-ios/altstore.json
